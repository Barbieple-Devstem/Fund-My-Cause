query CampaignDetail($id: ID!) {
  campaignDetail(id: $id) {
    campaign {
      id
      contractId
      title
      description
      creator
      goal
      raised
      deadline
      status
      category
      image
      videoUrl
      minContribution
      totalRaised
      totalContributors
      percentageFunded
      daysRemaining
      token
      platformFeeBps
      hasRBACEnabled
      createdAt
      updatedAt
    }
    contributors {
      address
      amount
      contributionCount
      isTopContributor
    }
    topContributors(limit: 5) {
      rank
      address
      amount
      percentage
    }
    updates {
      id
      content
      timestamp
    }
    milestones {
      id
      title
      description
      targetAmount
      releasePercentage
      status
    }
  }
}
